<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bullpen — Stock Simulator</title>
  <meta name="description" content="Paper-trade real stocks with live prices. Create games, compete with friends.">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav" id="nav" hidden>
    <div class="nav-inner">
      <a href="#/" class="brand"><img src="icon.svg" alt="" width="26" height="26"><span>Bullpen</span></a>
      <nav class="tabs" id="tabs">
        <a href="#/">Dashboard</a>
        <a href="#/portfolio">Portfolio</a>
        <a href="#/trade">Trade</a>
        <a href="#/research">Research</a>
        <a href="#/games">Games</a>
        <a href="#/screener">Screener</a>
        <a href="#/watchlist">Watchlist</a>
        <a href="#/leaderboard">Leaderboard</a>
        <a href="#/friends">Friends</a>
        <a href="#/lessons">Lessons</a>
      </nav>
      <div class="nav-right">
        <label class="game-pick"><span class="sr">Active game</span><select id="gameSelect"></select></label>
        <button class="bell" id="bell" aria-label="Notifications" aria-haspopup="menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span id="bellCount" hidden>0</span></button>
        <div class="menu bell-menu" id="bellMenu" role="menu" hidden></div>
        <button class="avatar" id="avatarBtn" aria-haspopup="menu"></button>
        <div class="menu" id="avatarMenu" role="menu" hidden>
          <div class="menu-head" id="menuHead"></div>
          <a href="#/profile" role="menuitem">Profile</a>
          <a href="#/alerts" role="menuitem">Price alerts</a>
          <a href="#/settings" role="menuitem">Settings</a>
          <button role="menuitem" id="kbdHelp">Keyboard shortcuts</button>
          <button role="menuitem" id="signOut">Sign out</button>
        </div>
      </div>
    </div>
  </header>
  <main id="app"></main>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
